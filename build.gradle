plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
    id 'org.sonarqube' version '7.2.2.6593'
    id 'com.github.ben-manes.versions' version '0.53.0'
    id 'se.patrikerdes.use-latest-versions' version '0.2.19'
    id 'org.cyclonedx.bom' version '2.2.0'
}

group = 'com.eudistack'
version = '3.8.0'

ext['netty.version'] = '4.1.132.Final'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    toolVersion = "0.8.14"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Spring Boot Starters ---
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- Security ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // --- Persistence ---
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql:11.2.0'
    implementation 'com.google.guava:guava:33.6.0-jre'

    // --- JSON Schema Validation ---
    implementation 'com.networknt:json-schema-validator:1.5.6'

    // --- Serialization ---
    implementation 'com.upokecenter:cbor:4.5.4'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'io.github.ehn-digital-green-development:base45:0.0.3'

    // --- Cryptography ---
    implementation 'com.nimbusds:nimbus-jose-jwt:9.40'
    implementation 'com.nimbusds:oauth2-oidc-sdk:11.21.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'

    // --- Email ---
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // --- QR Code Generation ---
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.zxing:javase:3.5.4'

    // --- Documentation ---
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0'

    // --- Caching ---
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // --- Messaging (EUD-225: revocation-instruction queue, AD-5/AD-6) ---
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // --- Observability ---
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    // Dual gRPC export (OTel Collector → Zipkin/Prometheus), alongside the HTTP/Jaeger path above
    implementation 'io.micrometer:micrometer-registry-otlp'
    implementation 'io.opentelemetry.proto:opentelemetry-proto:1.5.0-alpha'
    // Boot has no Logback→OTel bridge; version pinned (not via the instrumentation BOM,
    // which would override opentelemetry-api to a version Boot doesn't manage) to the
    // release pairing with opentelemetry-api 1.49.0, the version Boot 3.5.11 manages.
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.15.0-alpha'
    implementation platform('io.grpc:grpc-bom:1.69.0')
    implementation 'io.grpc:grpc-netty-shaded'
    implementation 'io.grpc:grpc-stub'
    implementation 'io.grpc:grpc-protobuf'

    // --- DevTools ---
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.jetbrains:annotations:26.1.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Testing ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    // --- Integration Testing ---
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.awaitility:awaitility'
}

configurations.configureEach {
    exclude module: 'slf4j-simple'
}

// --- Quality & CI ---

cyclonedxBom {
    includeConfigs = ['runtimeClasspath']
    schemaVersion = '1.6'
    destination = project.file('build/reports/sbom')
    outputName = 'sbom'
    outputFormat = 'json'
    includeBomSerialNumber = false
    includeLicenseText = false
}

sonar {
    properties {
        property 'sonar.projectKey', 'in2workspace_eudistack-core-issuer'
        property 'sonar.organization', 'in2workspace'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sources', 'src/main/java,src/main/resources'
        property 'sonar.exclusions', 'src/main/resources/**/*.sql'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions',
                "src/main/java/**/IssuerApiApplication.java, " +
                        "src/main/java/**/SecurityConfig.java, " +
                        "src/main/java/**/VerifierServiceImpl.java, " +
                        "src/main/java/**/InternalCORSConfig.java, " +
                        "src/main/java/**/PublicCORSConfig.java, " +
                        "src/main/java/**/TokenController.java"
    }
}

checkstyle {
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

checkstyleMain {
    source = 'src/main/java'
}

checkstyleTest {
    source = 'src/test/java'
}

// --- Tasks ---

tasks.named('compileJava') {
    inputs.files(tasks.named('processResources'))
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy(tasks.jacocoTestReport)
}

tasks.jacocoTestReport {
    dependsOn(tasks.test)
    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.outputLocation.set(layout.buildDirectory.dir('jacocoHtml'))
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                "**/IssuerApiApplication.class",
                "**/enums/**",
                "**/Constants.class",
                "**/FlywayConfig.class",
                "**/SecurityConfig.class"
        ])
    }))
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}
